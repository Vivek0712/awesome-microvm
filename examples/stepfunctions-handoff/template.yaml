AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Step Functions state machine that leases a Lambda MicroVM (built with microvm-ctl) to one
  task with runMicrovm.waitForTaskToken and lets the VM complete the task token itself.
  Generated by generate.py from microvm.integrations.stepfunctions; do not edit by hand.

Parameters:
  ImageName:
    Type: String
    Default: handoff-agent
    Description: Name of the agent MicroVM image built with `mvm image build`.
  Budget:
    Type: Number
    Default: 300
    Description: Seconds the state machine waits for the VM (TimeoutSeconds); the VM cap is Budget + 120.

Resources:
  # ---- the role the leased VM runs as: logs on both group prefixes, task token calls back to this machine
  AgentExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-agent
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: [sts:AssumeRole, sts:TagSession]
      Policies:
        - PolicyName: agent
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/microvms/*
              - Sid: CompleteTheLease
                Effect: Allow
                Action: [states:SendTaskSuccess, states:SendTaskFailure, states:SendTaskHeartbeat]
                # the machine is named below so this ARN is known before it exists (no circular reference)
                Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-lease

  # ---- the role the state machine runs as: launch, list, terminate, and pass the agent role
  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-states
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: orchestrator
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [lambda:RunMicrovm, lambda:TerminateMicrovm, lambda:ListMicrovms, lambda:GetMicrovm]
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt AgentExecutionRole.Arn
              - Effect: Allow
                Action: lambda:PassNetworkConnector
                Resource: arn:aws:lambda:*:aws:network-connector:aws-network-connector:*

  # ---- Lease (waitForTaskToken) -> Terminate -> Done; timeouts and failures -> Reap -> TerminateStale -> Failed
  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${AWS::StackName}-lease
      StateMachineType: STANDARD
      RoleArn: !GetAtt StateMachineRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "microvm-ctl lease of ${ImageName}: budget ${Budget}s, VM cap Budget + 120s (generated by generate.py, do not edit by hand)",
          "QueryLanguage": "JSONata",
          "StartAt": "Lease",
          "States": {
            "Lease": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:runMicrovm.waitForTaskToken",
              "Arguments": {
                "ImageIdentifier": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ImageName}",
                "ExecutionRoleArn": "${AgentExecutionRole.Arn}",
                "RunHookPayload": "{% $string({'lease': {'kind': 'sfn', 'token': $states.context.Task.Token, 'region': '${AWS::Region}', 'heartbeat_s': 30, 'id': $states.context.Execution.Name}, 'task': $states.input}) %}",
                "IdlePolicy": {
                  "MaxIdleDurationSeconds": ${Budget},
                  "SuspendedDurationSeconds": 60,
                  "AutoResumeEnabled": false
                },
                "MaximumDurationInSeconds": "{% ${Budget} + 120 %}",
                "ClientToken": "{% $substring($states.context.Execution.Name & '-' & $states.context.State.Name, 0, 128) %}"
              },
              "TimeoutSeconds": ${Budget},
              "HeartbeatSeconds": 90,
              "Retry": [
                {
                  "ErrorEquals": [
                    "LambdaMicrovms.ThrottlingException",
                    "LambdaMicrovms.ServiceQuotaExceededException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 8,
                  "BackoffRate": 2,
                  "JitterStrategy": "FULL"
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.Timeout",
                    "States.HeartbeatTimeout",
                    "States.TaskFailed"
                  ],
                  "Assign": {
                    "lease_error": "{% $states.errorOutput %}"
                  },
                  "Next": "OnLeaseError"
                }
              ],
              "Assign": {
                "vm": "{% $states.result.microvm_id %}"
              },
              "Next": "Terminate"
            },
            "OnLeaseError": {
              "Type": "Choice",
              "Choices": [
                {
                  "Condition": "{% $contains($string($lease_error.Cause), '\"microvm_id\"') %}",
                  "Next": "TerminateFailed"
                }
              ],
              "Default": "Reap"
            },
            "TerminateFailed": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:terminateMicrovm",
              "Arguments": {
                "MicrovmIdentifier": "{% $parse($lease_error.Cause).microvm_id %}"
              },
              "Retry": [
                {
                  "ErrorEquals": [
                    "LambdaMicrovms.ThrottlingException",
                    "LambdaMicrovms.ServiceQuotaExceededException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 8,
                  "BackoffRate": 2,
                  "JitterStrategy": "FULL"
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "Next": "Reap"
                }
              ],
              "Next": "Reap"
            },
            "Terminate": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:terminateMicrovm",
              "Arguments": {
                "MicrovmIdentifier": "{% $vm %}"
              },
              "Retry": [
                {
                  "ErrorEquals": [
                    "LambdaMicrovms.ThrottlingException",
                    "LambdaMicrovms.ServiceQuotaExceededException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 8,
                  "BackoffRate": 2,
                  "JitterStrategy": "FULL"
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": [
                    "LambdaMicrovms.ResourceNotFoundException"
                  ],
                  "Output": "{% $states.input %}",
                  "Next": "Done"
                }
              ],
              "Output": "{% $states.input %}",
              "Next": "Done"
            },
            "Reap": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:listMicrovms",
              "Arguments": {
                "ImageIdentifier": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ImageName}"
              },
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "Next": "Failed"
                }
              ],
              "Next": "TerminateStale"
            },
            "TerminateStale": {
              "Type": "Map",
              "Items": "{% [$states.input.Items[State in ['RUNNING', 'SUSPENDED', 'PENDING'] and $toMillis(StartedAt) < $toMillis($now()) - (${Budget} + 120) * 1000]] %}",
              "MaxConcurrency": 4,
              "ItemProcessor": {
                "ProcessorConfig": {
                  "Mode": "INLINE"
                },
                "StartAt": "TerminateOne",
                "States": {
                  "TerminateOne": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:terminateMicrovm",
                    "Arguments": {
                      "MicrovmIdentifier": "{% $states.input.MicrovmId %}"
                    },
                    "Retry": [
                      {
                        "ErrorEquals": [
                          "LambdaMicrovms.ThrottlingException",
                          "LambdaMicrovms.ServiceQuotaExceededException"
                        ],
                        "IntervalSeconds": 2,
                        "MaxAttempts": 8,
                        "BackoffRate": 2,
                        "JitterStrategy": "FULL"
                      }
                    ],
                    "Catch": [
                      {
                        "ErrorEquals": [
                          "LambdaMicrovms.ResourceNotFoundException"
                        ],
                        "Next": "AlreadyGone"
                      }
                    ],
                    "End": true
                  },
                  "AlreadyGone": {
                    "Type": "Pass",
                    "End": true
                  }
                }
              },
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "Next": "Failed"
                }
              ],
              "Next": "Failed"
            },
            "Failed": {
              "Type": "Fail",
              "Error": "LeaseFailed",
              "Cause": "{% $string($lease_error) %}"
            },
            "Done": {
              "Type": "Succeed"
            }
          }
        }

Outputs:
  StateMachineArn:
    Value: !Ref StateMachine
    Description: Start executions here; run.sh reads it from the stack.
  AgentExecutionRoleArn:
    Value: !GetAtt AgentExecutionRole.Arn
    Description: Pass as MVM_EXECUTION_ROLE_ARN when leasing the agent image by hand.
