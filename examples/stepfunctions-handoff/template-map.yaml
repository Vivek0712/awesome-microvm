AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Step Functions state machine that leases one Lambda MicroVM (built with microvm-ctl) per
  element of the input's `shards` array with a Map over runMicrovm.waitForTaskToken, at most
  MaxConcurrency at a time, optionally behind an SNS approval gate above a shard count.
  Generated by generate.py from microvm.integrations.stepfunctions; do not edit by hand.

Parameters:
  ImageName:
    Type: String
    Default: handoff-agent
    Description: Name of the agent MicroVM image built with `mvm image build`.
  Budget:
    Type: Number
    Default: 300
    Description: Seconds each shard's lease waits for its VM (TimeoutSeconds); the VM cap is Budget + 120.
  MaxConcurrency:
    Type: Number
    Default: 4
    MinValue: 1
    Description: Shards in flight at once. Use the number `mvm lease plan --image <ImageName> --shards N` prints.
  ApprovalTopicArn:
    Type: String
    Default: ""
    Description: SNS topic for the approval gate; empty means no gate.
  ApproveAboveShards:
    Type: Number
    Default: 8
    MinValue: 0
    Description: With a topic set, executions with more shards than this wait for SendTaskSuccess first.

Conditions:
  HasApproval: !Not [!Equals [!Ref ApprovalTopicArn, ""]]

Resources:
  # ---- the role the leased VMs run as: logs on both group prefixes, task token calls back to this machine
  AgentExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-agent
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: [sts:AssumeRole, sts:TagSession]
      Policies:
        - PolicyName: agent
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/microvms/*
              - Sid: CompleteTheLease
                Effect: Allow
                Action: [states:SendTaskSuccess, states:SendTaskFailure, states:SendTaskHeartbeat]
                # the machine is named below so this ARN is known before it exists (no circular reference)
                Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-map

  # ---- the role the state machine runs as: launch, list, terminate, pass the agent role, publish the gate
  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-states
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: orchestrator
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [lambda:RunMicrovm, lambda:TerminateMicrovm, lambda:ListMicrovms, lambda:GetMicrovm]
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt AgentExecutionRole.Arn
              - Effect: Allow
                Action: lambda:PassNetworkConnector
                Resource: arn:aws:lambda:*:aws:network-connector:aws-network-connector:*
              - !If
                - HasApproval
                - Effect: Allow
                  Action: sns:Publish
                  Resource: !Ref ApprovalTopicArn
                - !Ref AWS::NoValue

  # ---- [Gate -> RequestApproval ->] Fanout (Map: Lease -> Terminate -> Done per shard) -> Done: the VM payloads
  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${AWS::StackName}-map
      StateMachineType: STANDARD
      RoleArn: !GetAtt StateMachineRole.Arn
      DefinitionString: !If
        - HasApproval
        - !Sub |
            {
              "Comment": "microvm-ctl lease fan-out of ${ImageName}: ${MaxConcurrency} at a time, budget ${Budget}s, VM cap Budget + 120s, approval above ${ApproveAboveShards} shards (generated by generate.py, do not edit by hand)",
              "QueryLanguage": "JSONata",
              "StartAt": "Gate",
              "States": {
                "Gate": {
                  "Type": "Choice",
                  "Choices": [
                    {
                      "Condition": "{% $count($states.input.shards) > ${ApproveAboveShards} %}",
                      "Next": "RequestApproval"
                    }
                  ],
                  "Default": "Fanout"
                },
                "RequestApproval": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::sns:publish.waitForTaskToken",
                  "Arguments": {
                    "TopicArn": "${ApprovalTopicArn}",
                    "Message": "{% $string({'action': 'microvm-ctl lease fan-out approval', 'shards': $count($states.input.shards), 'image': 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ImageName}', 'execution': $states.context.Execution.Name, 'task_token': $states.context.Task.Token}) %}"
                  },
                  "TimeoutSeconds": 3600,
                  "Catch": [
                    {
                      "ErrorEquals": [
                        "States.Timeout",
                        "States.TaskFailed"
                      ],
                      "Next": "Denied"
                    }
                  ],
                  "Output": "{% $states.input %}",
                  "Next": "Fanout"
                },
                "Denied": {
                  "Type": "Fail",
                  "Error": "ApprovalDenied",
                  "Cause": "no approval within 3600s, or the approver sent a task failure"
                },
                "Fanout": {
                  "Type": "Map",
                  "Items": "{% $map($states.input.shards, function($v, $i) { {'index': $i, 'task': $v} }) %}",
                  "MaxConcurrency": ${MaxConcurrency},
                  "ItemProcessor": {
                    "ProcessorConfig": {
                      "Mode": "INLINE"
                    },
                    "StartAt": "Lease",
                    "States": {
                      "Lease": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:runMicrovm.waitForTaskToken",
                        "Arguments": {
                          "ImageIdentifier": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ImageName}",
                          "ExecutionRoleArn": "${AgentExecutionRole.Arn}",
                          "RunHookPayload": "{% $string({'lease': {'kind': 'sfn', 'token': $states.context.Task.Token, 'region': '${AWS::Region}', 'heartbeat_s': 30, 'id': $states.context.Execution.Name & '-' & $string($states.input.index)}, 'task': $states.input.task}) %}",
                          "IdlePolicy": {
                            "MaxIdleDurationSeconds": ${Budget},
                            "SuspendedDurationSeconds": 60,
                            "AutoResumeEnabled": false
                          },
                          "MaximumDurationInSeconds": "{% ${Budget} + 120 %}",
                          "ClientToken": "{% $substring($states.context.Execution.Name & '-' & $states.context.State.Name & '-' & $string($states.input.index), 0, 128) %}"
                        },
                        "TimeoutSeconds": ${Budget},
                        "HeartbeatSeconds": 90,
                        "Retry": [
                          {
                            "ErrorEquals": [
                              "LambdaMicrovms.ThrottlingException",
                              "LambdaMicrovms.ServiceQuotaExceededException"
                            ],
                            "IntervalSeconds": 2,
                            "MaxAttempts": 8,
                            "BackoffRate": 2,
                            "JitterStrategy": "FULL"
                          }
                        ],
                        "Catch": [
                          {
                            "ErrorEquals": [
                              "States.Timeout",
                              "States.HeartbeatTimeout",
                              "States.TaskFailed"
                            ],
                            "Assign": {
                              "lease_error": "{% $states.errorOutput %}"
                            },
                            "Next": "OnLeaseError"
                          }
                        ],
                        "Assign": {
                          "vm": "{% $states.result.microvm_id %}"
                        },
                        "Next": "Terminate"
                      },
                      "OnLeaseError": {
                        "Type": "Choice",
                        "Choices": [
                          {
                            "Condition": "{% $contains($string($lease_error.Cause), '\"microvm_id\"') %}",
                            "Next": "TerminateFailed"
                          }
                        ],
                        "Default": "Reap"
                      },
                      "TerminateFailed": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:terminateMicrovm",
                        "Arguments": {
                          "MicrovmIdentifier": "{% $parse($lease_error.Cause).microvm_id %}"
                        },
                        "Retry": [
                          {
                            "ErrorEquals": [
                              "LambdaMicrovms.ThrottlingException",
                              "LambdaMicrovms.ServiceQuotaExceededException"
                            ],
                            "IntervalSeconds": 2,
                            "MaxAttempts": 8,
                            "BackoffRate": 2,
                            "JitterStrategy": "FULL"
                          }
                        ],
                        "Catch": [
                          {
                            "ErrorEquals": [
                              "States.ALL"
                            ],
                            "Next": "Reap"
                          }
                        ],
                        "Next": "Reap"
                      },
                      "Terminate": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:terminateMicrovm",
                        "Arguments": {
                          "MicrovmIdentifier": "{% $vm %}"
                        },
                        "Retry": [
                          {
                            "ErrorEquals": [
                              "LambdaMicrovms.ThrottlingException",
                              "LambdaMicrovms.ServiceQuotaExceededException"
                            ],
                            "IntervalSeconds": 2,
                            "MaxAttempts": 8,
                            "BackoffRate": 2,
                            "JitterStrategy": "FULL"
                          }
                        ],
                        "Catch": [
                          {
                            "ErrorEquals": [
                              "LambdaMicrovms.ResourceNotFoundException"
                            ],
                            "Output": "{% $states.input %}",
                            "Next": "ShardDone"
                          }
                        ],
                        "Output": "{% $states.input %}",
                        "Next": "ShardDone"
                      },
                      "Reap": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:listMicrovms",
                        "Arguments": {
                          "ImageIdentifier": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ImageName}"
                        },
                        "Catch": [
                          {
                            "ErrorEquals": [
                              "States.ALL"
                            ],
                            "Next": "Failed"
                          }
                        ],
                        "Next": "TerminateStale"
                      },
                      "TerminateStale": {
                        "Type": "Map",
                        "Items": "{% [$states.input.Items[State in ['RUNNING', 'SUSPENDED', 'PENDING'] and $toMillis(StartedAt) < $toMillis($now()) - (${Budget} + 120) * 1000]] %}",
                        "MaxConcurrency": 4,
                        "ItemProcessor": {
                          "ProcessorConfig": {
                            "Mode": "INLINE"
                          },
                          "StartAt": "TerminateOne",
                          "States": {
                            "TerminateOne": {
                              "Type": "Task",
                              "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:terminateMicrovm",
                              "Arguments": {
                                "MicrovmIdentifier": "{% $states.input.MicrovmId %}"
                              },
                              "Retry": [
                                {
                                  "ErrorEquals": [
                                    "LambdaMicrovms.ThrottlingException",
                                    "LambdaMicrovms.ServiceQuotaExceededException"
                                  ],
                                  "IntervalSeconds": 2,
                                  "MaxAttempts": 8,
                                  "BackoffRate": 2,
                                  "JitterStrategy": "FULL"
                                }
                              ],
                              "Catch": [
                                {
                                  "ErrorEquals": [
                                    "LambdaMicrovms.ResourceNotFoundException"
                                  ],
                                  "Next": "AlreadyGone"
                                }
                              ],
                              "End": true
                            },
                            "AlreadyGone": {
                              "Type": "Pass",
                              "End": true
                            }
                          }
                        },
                        "Catch": [
                          {
                            "ErrorEquals": [
                              "States.ALL"
                            ],
                            "Next": "Failed"
                          }
                        ],
                        "Next": "Failed"
                      },
                      "Failed": {
                        "Type": "Fail",
                        "Error": "LeaseFailed",
                        "Cause": "{% $string($lease_error) %}"
                      },
                      "ShardDone": {
                        "Type": "Succeed"
                      }
                    }
                  },
                  "Next": "Done"
                },
                "Done": {
                  "Type": "Succeed"
                }
              }
            }
        - !Sub |
            {
              "Comment": "microvm-ctl lease fan-out of ${ImageName}: ${MaxConcurrency} at a time, budget ${Budget}s, VM cap Budget + 120s (generated by generate.py, do not edit by hand)",
              "QueryLanguage": "JSONata",
              "StartAt": "Fanout",
              "States": {
                "Fanout": {
                  "Type": "Map",
                  "Items": "{% $map($states.input.shards, function($v, $i) { {'index': $i, 'task': $v} }) %}",
                  "MaxConcurrency": ${MaxConcurrency},
                  "ItemProcessor": {
                    "ProcessorConfig": {
                      "Mode": "INLINE"
                    },
                    "StartAt": "Lease",
                    "States": {
                      "Lease": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:runMicrovm.waitForTaskToken",
                        "Arguments": {
                          "ImageIdentifier": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ImageName}",
                          "ExecutionRoleArn": "${AgentExecutionRole.Arn}",
                          "RunHookPayload": "{% $string({'lease': {'kind': 'sfn', 'token': $states.context.Task.Token, 'region': '${AWS::Region}', 'heartbeat_s': 30, 'id': $states.context.Execution.Name & '-' & $string($states.input.index)}, 'task': $states.input.task}) %}",
                          "IdlePolicy": {
                            "MaxIdleDurationSeconds": ${Budget},
                            "SuspendedDurationSeconds": 60,
                            "AutoResumeEnabled": false
                          },
                          "MaximumDurationInSeconds": "{% ${Budget} + 120 %}",
                          "ClientToken": "{% $substring($states.context.Execution.Name & '-' & $states.context.State.Name & '-' & $string($states.input.index), 0, 128) %}"
                        },
                        "TimeoutSeconds": ${Budget},
                        "HeartbeatSeconds": 90,
                        "Retry": [
                          {
                            "ErrorEquals": [
                              "LambdaMicrovms.ThrottlingException",
                              "LambdaMicrovms.ServiceQuotaExceededException"
                            ],
                            "IntervalSeconds": 2,
                            "MaxAttempts": 8,
                            "BackoffRate": 2,
                            "JitterStrategy": "FULL"
                          }
                        ],
                        "Catch": [
                          {
                            "ErrorEquals": [
                              "States.Timeout",
                              "States.HeartbeatTimeout",
                              "States.TaskFailed"
                            ],
                            "Assign": {
                              "lease_error": "{% $states.errorOutput %}"
                            },
                            "Next": "OnLeaseError"
                          }
                        ],
                        "Assign": {
                          "vm": "{% $states.result.microvm_id %}"
                        },
                        "Next": "Terminate"
                      },
                      "OnLeaseError": {
                        "Type": "Choice",
                        "Choices": [
                          {
                            "Condition": "{% $contains($string($lease_error.Cause), '\"microvm_id\"') %}",
                            "Next": "TerminateFailed"
                          }
                        ],
                        "Default": "Reap"
                      },
                      "TerminateFailed": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:terminateMicrovm",
                        "Arguments": {
                          "MicrovmIdentifier": "{% $parse($lease_error.Cause).microvm_id %}"
                        },
                        "Retry": [
                          {
                            "ErrorEquals": [
                              "LambdaMicrovms.ThrottlingException",
                              "LambdaMicrovms.ServiceQuotaExceededException"
                            ],
                            "IntervalSeconds": 2,
                            "MaxAttempts": 8,
                            "BackoffRate": 2,
                            "JitterStrategy": "FULL"
                          }
                        ],
                        "Catch": [
                          {
                            "ErrorEquals": [
                              "States.ALL"
                            ],
                            "Next": "Reap"
                          }
                        ],
                        "Next": "Reap"
                      },
                      "Terminate": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:terminateMicrovm",
                        "Arguments": {
                          "MicrovmIdentifier": "{% $vm %}"
                        },
                        "Retry": [
                          {
                            "ErrorEquals": [
                              "LambdaMicrovms.ThrottlingException",
                              "LambdaMicrovms.ServiceQuotaExceededException"
                            ],
                            "IntervalSeconds": 2,
                            "MaxAttempts": 8,
                            "BackoffRate": 2,
                            "JitterStrategy": "FULL"
                          }
                        ],
                        "Catch": [
                          {
                            "ErrorEquals": [
                              "LambdaMicrovms.ResourceNotFoundException"
                            ],
                            "Output": "{% $states.input %}",
                            "Next": "ShardDone"
                          }
                        ],
                        "Output": "{% $states.input %}",
                        "Next": "ShardDone"
                      },
                      "Reap": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:listMicrovms",
                        "Arguments": {
                          "ImageIdentifier": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ImageName}"
                        },
                        "Catch": [
                          {
                            "ErrorEquals": [
                              "States.ALL"
                            ],
                            "Next": "Failed"
                          }
                        ],
                        "Next": "TerminateStale"
                      },
                      "TerminateStale": {
                        "Type": "Map",
                        "Items": "{% [$states.input.Items[State in ['RUNNING', 'SUSPENDED', 'PENDING'] and $toMillis(StartedAt) < $toMillis($now()) - (${Budget} + 120) * 1000]] %}",
                        "MaxConcurrency": 4,
                        "ItemProcessor": {
                          "ProcessorConfig": {
                            "Mode": "INLINE"
                          },
                          "StartAt": "TerminateOne",
                          "States": {
                            "TerminateOne": {
                              "Type": "Task",
                              "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:terminateMicrovm",
                              "Arguments": {
                                "MicrovmIdentifier": "{% $states.input.MicrovmId %}"
                              },
                              "Retry": [
                                {
                                  "ErrorEquals": [
                                    "LambdaMicrovms.ThrottlingException",
                                    "LambdaMicrovms.ServiceQuotaExceededException"
                                  ],
                                  "IntervalSeconds": 2,
                                  "MaxAttempts": 8,
                                  "BackoffRate": 2,
                                  "JitterStrategy": "FULL"
                                }
                              ],
                              "Catch": [
                                {
                                  "ErrorEquals": [
                                    "LambdaMicrovms.ResourceNotFoundException"
                                  ],
                                  "Next": "AlreadyGone"
                                }
                              ],
                              "End": true
                            },
                            "AlreadyGone": {
                              "Type": "Pass",
                              "End": true
                            }
                          }
                        },
                        "Catch": [
                          {
                            "ErrorEquals": [
                              "States.ALL"
                            ],
                            "Next": "Failed"
                          }
                        ],
                        "Next": "Failed"
                      },
                      "Failed": {
                        "Type": "Fail",
                        "Error": "LeaseFailed",
                        "Cause": "{% $string($lease_error) %}"
                      },
                      "ShardDone": {
                        "Type": "Succeed"
                      }
                    }
                  },
                  "Next": "Done"
                },
                "Done": {
                  "Type": "Succeed"
                }
              }
            }

Outputs:
  StateMachineArn:
    Value: !Ref StateMachine
    Description: 'Start executions here with {"shards": [task, ...]}; run-map.sh reads it from the stack.'
  AgentExecutionRoleArn:
    Value: !GetAtt AgentExecutionRole.Arn
    Description: Pass as MVM_EXECUTION_ROLE_ARN when leasing the agent image by hand.
