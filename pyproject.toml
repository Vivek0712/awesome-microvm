[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome-microvm"
version = "0.1.0"
description = "Control & execution plane for AWS Lambda MicroVMs — deploy, scale, monitor, and drive Firecracker microVM fleets like a pro."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vivek Raja P S" }]
keywords = ["aws", "lambda", "microvm", "firecracker", "sandbox", "serverless"]
dependencies = [
    "boto3>=1.34",
    "requests>=2.31",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "moto>=5"]

[project.scripts]
mvm = "microvm.cli:main"

[tool.setuptools.packages.find]
include = ["microvm*"]

[tool.setuptools.package-data]
microvm = ["data/**/*"]
