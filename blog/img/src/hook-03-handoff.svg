<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a2e"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd8e6"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- title -->
  <text x="80" y="88" font-size="44" font-weight="700" fill="#f3f6fb">One lease. The VM finishes the job itself.</text>
  <text x="80" y="128" font-size="22" fill="#9fb0c8">The orchestrator launches with the task and its own wait token in the payload, then sleeps until the VM calls back.</text>

  <!-- three orchestrators -->
  <g font-size="20">
    <rect x="80" y="200" width="400" height="96" rx="14" fill="#13233b" stroke="#2c4a75" stroke-width="2"/>
    <text x="104" y="238" fill="#f3f6fb" font-weight="600">Step Functions</text>
    <text x="104" y="270" fill="#9fb0c8" font-size="15">waits on a task token, runMicrovm.waitForTaskToken</text>

    <rect x="80" y="330" width="400" height="96" rx="14" fill="#13233b" stroke="#2c4a75" stroke-width="2"/>
    <text x="104" y="368" fill="#f3f6fb" font-weight="600">Lambda durable function</text>
    <text x="104" y="400" fill="#9fb0c8" font-size="15">waits on a callback id, billed nothing meanwhile</text>

    <rect x="80" y="460" width="400" height="96" rx="14" fill="#13233b" stroke="#2c4a75" stroke-width="2"/>
    <text x="104" y="498" fill="#f3f6fb" font-weight="600">Your own controller</text>
    <text x="104" y="530" fill="#9fb0c8" font-size="15">waits on SQS, EventBridge, or an HTTP collector</text>
  </g>

  <!-- converge to the lease -->
  <path d="M480,248 C530,248 530,378 560,378" fill="none" stroke="#cfd8e6" stroke-width="2.5"/>
  <path d="M480,378 L560,378" fill="none" stroke="#cfd8e6" stroke-width="2.5"/>
  <path d="M480,508 C530,508 530,378 560,378" fill="none" stroke="#cfd8e6" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- the lease envelope -->
  <g>
    <rect x="560" y="300" width="360" height="156" rx="16" fill="#1a1230" stroke="#f472b6" stroke-width="3"/>
    <text x="584" y="336" font-size="15" fill="#f472b6" letter-spacing="2">RUNHOOKPAYLOAD</text>
    <text x="584" y="372" font-size="19" fill="#f3f6fb" font-family="Menlo, Consolas, monospace">{"lease": {kind, token,</text>
    <text x="584" y="400" font-size="19" fill="#f3f6fb" font-family="Menlo, Consolas, monospace">          heartbeat_s: 10},</text>
    <text x="584" y="428" font-size="19" fill="#f3f6fb" font-family="Menlo, Consolas, monospace"> "task":  {steps: [...]}}</text>
  </g>
  <text x="740" y="284" font-size="16" fill="#9fb0c8" text-anchor="middle">one RunMicrovm call, no polling, no token mint</text>

  <!-- into the VM -->
  <path d="M920,378 L990,378" fill="none" stroke="#f472b6" stroke-width="3" marker-end="url(#arrp)"/>

  <!-- the MicroVM -->
  <g>
    <rect x="990" y="200" width="530" height="356" rx="18" fill="#0f2a25" stroke="#34d399" stroke-width="3"/>
    <text x="1014" y="238" font-size="14" fill="#34d399" letter-spacing="2">LAMBDA MICROVM, 512 MIB, FROM A SNAPSHOT</text>
    <g font-size="16" fill="#e5efe9">
      <text x="1014" y="280">1. /run accepts the lease before the endpoint opens</text>
      <text x="1014" y="314">2. runs the steps; phase and progress on /status</text>
      <text x="1014" y="348">3. heartbeats the orchestrator every 10 s</text>
      <text x="1014" y="382">4. completes the lease itself with the orchestrator's own API:</text>
      <text x="1040" y="410" font-size="14" fill="#9fd9c4" font-family="Menlo, Consolas, monospace">SendTaskSuccess / SendDurableExecutionCallbackSuccess</text>
      <text x="1040" y="434" font-size="14" fill="#9fd9c4" font-family="Menlo, Consolas, monospace">sqs:SendMessage / events:PutEvents / HTTP POST</text>
      <text x="1014" y="472">5. a typed failure names its microvm_id, so the orchestrator</text>
      <text x="1040" y="500">terminates it at once; a timeout is capped at budget + slack</text>
    </g>
  </g>

  <!-- callback loop back to the orchestrators -->
  <path d="M1255,556 L1255,640 L280,640 L280,556" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrg)"/>
  <text x="770" y="628" font-size="18" fill="#34d399" text-anchor="middle">completion or typed failure arrives; the orchestrator wakes, reads the result, terminates the VM</text>

  <!-- measured strip -->
  <g>
    <rect x="80" y="700" width="1440" height="120" rx="16" fill="#0f1c30" stroke="#1f3555" stroke-width="2"/>
    <g font-size="15" fill="#9fb0c8" letter-spacing="1.5">
      <text x="140" y="738">SINGLE LEASE, P50</text>
      <text x="500" y="738">COST PER LEASE</text>
      <text x="820" y="738">FAN-OUT OF 8, P50</text>
      <text x="1160" y="738">IMAGES</text>
    </g>
    <g font-size="38" font-weight="700" fill="#f3f6fb">
      <text x="140" y="790">4.3 s</text>
      <text x="500" y="790">$0.00004</text>
      <text x="820" y="790">8.9 s / 13.7 s</text>
      <text x="1160" y="790">1</text>
    </g>
    <g font-size="15" fill="#6f83a1">
      <text x="240" y="790">both orchestrators</text>
      <text x="690" y="790">512 MiB</text>
      <text x="1060" y="790">sfn / durable</text>
      <text x="1200" y="790">for every orchestrator</text>
    </g>
  </g>
  <text x="1520" y="860" font-size="14" fill="#4d6382" text-anchor="end">measured live in us-east-1, microvm-ctl 0.3.1, github.com/Vivek0712/microvm-handoff-demo</text>
</svg>
