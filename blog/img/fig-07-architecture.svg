<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial" role="img" aria-label="Nested two-microVM containment: an inner cage runs the agent, an outer warden holds the flag and mirrors the log">
  <defs>
    <marker id="red" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f87171"/></marker>
    <marker id="mut" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b7689"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="360" rx="16" fill="#0f1420"/>
  <text x="28" y="34" fill="#9aa4b6" font-size="12.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">operator — mints flags, launches both VMs, reads the verdict (never inside)</text>

  <!-- OUTER warden -->
  <rect x="24" y="52" width="892" height="284" rx="14" fill="#141a26" stroke="#2a3342"/>
  <text x="44" y="78" fill="#818cf8" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">OUTER microVM · the WARDEN</text>

  <!-- flag -->
  <rect x="690" y="96" width="196" height="70" rx="10" fill="#13301f" stroke="#4ade80"/>
  <text x="788" y="126" text-anchor="middle" fill="#4ade80" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">OUTER FLAG</text>
  <text x="788" y="148" text-anchor="middle" fill="#4ade80" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">key-gated · 403</text>
  <!-- ledger -->
  <rect x="690" y="186" width="196" height="120" rx="10" fill="#161c28" stroke="#2a3342"/>
  <text x="788" y="214" text-anchor="middle" fill="#e7eaf1" font-size="12.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">independent ledger</text>
  <text x="788" y="236" text-anchor="middle" fill="#9aa4b6" font-size="11">hash-chained copy</text>
  <text x="788" y="258" text-anchor="middle" fill="#9aa4b6" font-size="11">of the cage's log</text>
  <text x="788" y="286" text-anchor="middle" fill="#e7eaf1" font-size="12.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">→ renders verdict</text>

  <!-- INNER cage -->
  <rect x="52" y="96" width="520" height="210" rx="12" fill="#0f1420" stroke="#818cf8" stroke-dasharray="2 0"/>
  <text x="72" y="122" fill="#818cf8" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">INNER microVM · the CAGE</text>

  <!-- agent -->
  <rect x="80" y="144" width="214" height="140" rx="10" fill="#161c28" stroke="#2a3342"/>
  <text x="187" y="176" text-anchor="middle" fill="#e7eaf1" font-size="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">AGENT</text>
  <text x="187" y="198" text-anchor="middle" fill="#f87171" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">goal: ESCAPE</text>
  <rect x="100" y="214" width="174" height="54" rx="8" fill="none" stroke="#4ade80" stroke-dasharray="5 4"/>
  <text x="187" y="238" text-anchor="middle" fill="#4ade80" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">Strands Box policy</text>
  <text x="187" y="256" text-anchor="middle" fill="#4ade80" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">(scenario B)</text>

  <!-- escape wall -->
  <line x1="572" y1="104" x2="572" y2="298" stroke="#f87171" stroke-width="1.5" opacity="0.55"/>
  <text x="564" y="296" text-anchor="end" fill="#f87171" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">boundary</text>

  <!-- escape arrows blocked -->
  <line x1="294" y1="186" x2="430" y2="186" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#red)"/>
  <text x="300" y="178" fill="#f87171" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">creds · control plane · flag</text>
  <line x1="430" y1="186" x2="540" y2="186" stroke="#2a3342" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="300" y="214" fill="#9aa4b6" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">all refused: least-privilege role,</text>
  <text x="300" y="229" fill="#9aa4b6" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">withheld warden key, per-VM isolation</text>

  <!-- DNS leak (A only) -->
  <path d="M294 164 Q470 120 650 150" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#mut)"/>
  <text x="430" y="126" text-anchor="middle" fill="#fbbf24" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">DNS tunnel — escapes loose (A), blocked by policy (B)</text>

  <!-- log mirror -->
  <path d="M294 270 Q500 320 686 250" fill="none" stroke="#6b7689" stroke-width="1.5" marker-end="url(#mut)"/>
  <text x="470" y="316" text-anchor="middle" fill="#9aa4b6" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">every action mirrored to the warden (tamper-evident)</text>
</svg>
