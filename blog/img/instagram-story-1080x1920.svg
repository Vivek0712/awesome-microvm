  <text x="72" y="820" font-size="20" fill="#94a3b8" letter-spacing="3">OPEN SOURCE  |  APACHE-2.0  |  ON PYPI</text>
  <text x="72" y="910" font-size="92" font-weight="800" fill="#f8fafc">microvm-ctl</text>
  <text x="72" y="968" font-size="32" fill="#cbd5e1">The control plane AWS Lambda</text>
  <text x="72" y="1010" font-size="32" fill="#cbd5e1">MicroVMs doesn't come with.</text>
  <rect x="72" y="1050" width="520" height="60" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="96" y="1090" font-size="26" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#34d399">$ pip install microvm-ctl</text>

  <text x="72" y="1250" font-size="88" font-weight="800" fill="#34d399">3.5 s</text>
  <text x="72" y="1290" font-size="22" fill="#94a3b8">from launch to serving</text>
  <text x="72" y="1420" font-size="88" font-weight="800" fill="#60a5fa">0.7 s</text>
  <text x="72" y="1460" font-size="22" fill="#94a3b8">to wake a sleeping VM, memory intact</text>
  <text x="72" y="1590" font-size="88" font-weight="800" fill="#f472b6">93.8%</text>
  <text x="72" y="1630" font-size="22" fill="#94a3b8">cheaper than always-on for an idle-heavy session</text>
  <text x="72" y="1710" font-size="22" fill="#cbd5e1">Eight working apps on top. Series link in bio.</text>
