  <text x="56" y="92" font-size="17" fill="#94a3b8" letter-spacing="3">OPEN SOURCE  |  APACHE-2.0  |  ON PYPI</text>
  <text x="56" y="160" font-size="64" font-weight="800" fill="#f8fafc">microvm-ctl</text>
  <text x="56" y="204" font-size="24" fill="#cbd5e1">The control plane AWS Lambda MicroVMs</text>
  <text x="56" y="236" font-size="24" fill="#cbd5e1">doesn't come with.</text>

